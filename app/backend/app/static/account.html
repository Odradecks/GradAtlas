<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GradAtlas 登录</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&display=swap">
  <style>
    :root { color-scheme: light; --ink: #1a1a1a; --muted: #8a8178; --line: #efeae4; --bg: #f7f5f2; --red: #E36A22; --red-deep: #C45516; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans SC", "Source Han Sans SC", "黑体", "Heiti SC", "SimHei", sans-serif; color: var(--ink); background: var(--bg); }
    h1, h2, strong { font-weight: 400; }
    a { color: var(--red); text-decoration: none; }
    .nav { display: flex; align-items: center; height: 60px; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; }
    main { max-width: 420px; margin: 48px auto; padding: 0 20px; }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    p { margin: 0 0 16px; color: var(--muted); }
    form, .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    label { display: block; margin: 12px 0 6px; font-size: 0.9rem; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
    button { display: block; width: 100%; margin-top: 16px; padding: 11px 14px; border: 0; border-radius: 10px; background: var(--red); color: #fff; text-align: center; cursor: pointer; font: inherit; }
    button:hover { background: var(--red-deep); }
    .google {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; height: 40px; margin: 0 0 16px; padding: 0 12px;
      border: 1px solid #747775; border-radius: 4px; background: #fff; color: #1f1f1f;
      font-size: 14px; line-height: 1; text-decoration: none;
    }
    .google:hover { background: #f8f9fa; box-shadow: 0 1px 2px rgba(60, 64, 67, .18); }
    .google:active { background: #f1f3f4; }
    .google svg { flex: none; }
    .error { color: #b42318; min-height: 1.2em; margin-top: 12px; }
    .switch { margin-top: 16px; text-align: center; }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/browse">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.5 16 15.5H2Z" fill="#F15A00"/></svg>
      GradAtlas
    </a>
  </header>
  <main>
    <h1 id="title">登录</h1>
    <p id="lead">登录后，收藏会保存在你的账户里。</p>
    <a class="google" id="google" href="/auth/google/start">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span id="google-label">使用 Google 账号登录</span>
    </a>
    <form id="form">
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required>
      <div id="confirm-row" hidden>
        <label for="confirm">再输入一次密码</label>
        <input id="confirm" type="password" minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" id="submit">登录</button>
      <p class="error" id="error"></p>
    </form>
    <p class="switch" id="switch"></p>
  </main>
  <script>
    const register = location.pathname === "/register";
    const title = document.getElementById("title");
    const lead = document.getElementById("lead");
    const submit = document.getElementById("submit");
    const confirmRow = document.getElementById("confirm-row");
    const switcher = document.getElementById("switch");
    document.getElementById("password").autocomplete = register ? "new-password" : "current-password";
    if (register) {
      title.textContent = "注册";
      lead.textContent = "用邮箱注册。已有谷歌账号也可以直接继续。";
      submit.textContent = "注册";
      document.getElementById("google-label").textContent = "使用 Google 账号注册";
      confirmRow.hidden = false;
      switcher.innerHTML = '已有账户？<a href="/login">登录</a>';
    } else {
      switcher.innerHTML = '还没有账户？<a href="/register">注册</a>';
    }
    fetch("/auth/me").then((response) => response.json()).then((payload) => {
      if (!payload.user) return;
      lead.textContent = "当前账户：" + payload.user.email;
      document.getElementById("form").hidden = true;
      document.getElementById("google").hidden = true;
      switcher.innerHTML = '<a href="/browse">返回项目</a>';
    });
    fetch("/auth/providers").then((response) => response.json()).then((payload) => {
      if (!payload.google) document.getElementById("google").title = "尚未配置谷歌登录";
    });
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.getElementById("error");
      error.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (register && password !== document.getElementById("confirm").value) {
        error.textContent = "两次密码不一致";
        return;
      }
      const response = await fetch(register ? "/auth/register" : "/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const payload = await response.json();
      if (!response.ok) {
        error.textContent = payload.detail || "没有完成";
        return;
      }
      location.href = "/browse";
    });
  </script>
</body>
</html>
